name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'dev/**'
    # 纯文档提交不跑：本仓库约 20% 的提交只改 docs 与 CHANGELOG
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '发布 GitHub Release（只在 main 上生效）'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 版本守卫：不编译，只读构建脚本与历史 tag，几秒完成
  version:
    name: Version guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify versionCode bump
        run: |
          set -euo pipefail
          file=app/build.gradle.kts
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$file" | head -n1 || true)
          code=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' "$file" | head -n1 || true)
          [ -n "$version" ] || { echo "::error::读不到 versionName"; exit 1; }
          [ -n "$code" ] || { echo "::error::读不到 versionCode"; exit 1; }

          git fetch --tags --force --quiet

          # 版本号没动 = 还在开发中，不要求递增；只有准备发新版本时才校验
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version 已发布，本次不涉及新版本（versionCode=$code）。"
            exit 0
          fi

          # 以历史所有 tag 里最大的 versionCode 为基线：只看最近一个 tag 会漏掉
          # 回退分支或补丁版本带来的乱序
          max=0
          base=""
          for tag in $(git tag --list 'v[0-9]*' --sort=-v:refname); do
            c=$(git show "$tag:$file" 2>/dev/null \
              | grep -oP 'versionCode\s*=\s*\K[0-9]+' | head -n1 || true)
            [ -n "$c" ] || continue
            if [ "$c" -gt "$max" ]; then
              max=$c
              base=$tag
            fi
          done

          if [ "$max" -eq 0 ]; then
            echo "没有可比对的历史版本，versionCode=$code 作为首次发布通过。"
            exit 0
          fi

          echo "基线 $base: versionCode=$max"
          echo "本版本 v$version: versionCode=$code"
          if [ "$code" -le "$max" ]; then
            echo "::error::准备发布 v$version，但 versionCode=$code 未超过 $base 的 $max。"
            echo "::error::Android 只允许用不小于已装版本的 versionCode 覆盖安装；不改的话存量用户装不上新版。"
            echo "::error::修法：把 app/build.gradle.kts 的 versionCode 改成 $((max + 1)) 或更大。"
            exit 1
          fi
          echo "versionCode 校验通过（$base 的 $max → $code）。"

  # 第一层：每次推送都跑，反馈要快（预热后约 2–3 分钟）
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # setup-gradle 自带依赖缓存与 wrapper 校验，不需要再手写 actions/cache
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # local.properties 不入库，SDK 位置由 ANDROID_HOME 提供
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

  # 第一层：与 test 并行，dev 上也跑，但只做 Lint 不做打包（约 3 分钟）
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  # 第二层：打包只在 main、PR 或手动时跑
  package:
    name: Assemble
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      # 没有 keystore.properties 时产出未签名包，只验证 R8 与资源收缩能过；
      # lintDebug 已在 lint job 里跑过，这里不重复
      - name: Assemble
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: lyra-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # 第三层：main 上全部检查通过后，用发布密钥重打签名包并挂到 GitHub Release
  release:
    name: Publish release
    needs: [test, lint, package, version]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.publish_release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # runner 上没有 git 身份，打 annotated tag 前必须显式配置
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # versionName 是 tag 的依据
      - name: Read version
        id: version
        run: |
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)
          if [ -z "$version" ]; then
            echo "::error::没能从 app/build.gradle.kts 读出 versionName"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "读取到版本：v$version"

      # 只要这个 tag 已经存在于远端，就说明该版本已经发过：跳过而不是重建，
      # 避免每次 push main 都把当前 HEAD 当成老版本再发一遍
      - name: Check existing tag
        id: existing
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG 已存在，跳过发布。发新版请先提升 app/build.gradle.kts 的 versionName。"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # 先判 tag 再判密钥：已发布过的版本不该因为没配 secrets 而变红
      # 只有 tag 不存在（= 新版本）时才要求发布说明存在，避免误发半成品
      - name: Check release notes
        if: steps.existing.outputs.published == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="docs/releases/v$VERSION/CHANGELOG.md"
          if [ ! -f "$notes" ]; then
            echo "::error::缺少发布说明 $notes。本仓库约定每个版本带一份，先补上再合入 main。"
            exit 1
          fi
          echo "发布说明：$notes"

      - name: Check release secrets
        if: steps.existing.outputs.published == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing RELEASE_STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing RELEASE_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::缺少签名相关 secrets:$missing（见 docs/ci.md）"
            exit 1
          fi

      - name: Set up JDK 17
        if: steps.existing.outputs.published == 'false'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.existing.outputs.published == 'false'
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        if: steps.existing.outputs.published == 'false'
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      # 密钥只落在 workspace 里，用完即随 runner 销毁；两个文件名都在 .gitignore 中
      - name: Restore keystore
        if: steps.existing.outputs.published == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # secret 常从 Windows 文本框粘贴，带 CRLF 或行内空格；GNU base64 只忽略
          # \n，遇到 \r 直接报 "invalid input"，所以先在脚本里剔除空白字符
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 -d > release.jks
          # 解出来必须是一个能打开的 keystore：解出 0 字节或截断时立刻失败，
          # 不要等到 Gradle 签名阶段才报一个看不出根因的错误
          if [ ! -s release.jks ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 解码后为空，请确认粘贴的是完整 base64。"
            exit 1
          fi
          head -c 4 release.jks | od -An -tx1 | tr -d ' \n' | grep -qx 'feedfeed' \
            || echo "::warning::解码结果不是 JKS 文件头（feedfeed），若为 PKCS12 可忽略。"
          # Properties 里反斜杠是转义符，口令含 \ 时必须写两次才不会读错
          {
            printf 'storeFile=release.jks\n'
            printf 'storePassword=%s\n' "${STORE_PASSWORD//\\/\\\\}"
            printf 'keyAlias=%s\n' "${KEY_ALIAS//\\/\\\\}"
            printf 'keyPassword=%s\n' "${KEY_PASSWORD//\\/\\\\}"
          } > keystore.properties
          chmod 600 release.jks keystore.properties

      - name: Assemble signed release
        if: steps.existing.outputs.published == 'false'
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify signature
        if: steps.existing.outputs.published == 'false'
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -z "$apk" ]; then
            echo "::error::没有产出 release APK"
            exit 1
          fi
          echo "APK: $apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"

      - name: Publish GitHub Release
        if: steps.existing.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          # 资产名带版本号，下载到本地不会与别的版本混淆
          asset="lyra-v$VERSION.apk"
          cp "$apk" "$asset"
          # 沿用本仓库的 annotated tag 约定，tag 打在这次 main 的提交上
          git tag -a "$TAG" -m "v$VERSION" "$GITHUB_SHA"
          git push origin "$TAG"
          # 发布说明沿用仓库约定：docs/releases/vX.Y.Z/CHANGELOG.md（前面已校验存在）
          notes="docs/releases/v$VERSION/CHANGELOG.md"
          # Release 正文是独立页面，文档里的相对链接在那里会 404，先改写成绝对链接
          sed -E "s#\]\(([^):/][^)]*)\)#](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/releases/v${VERSION}/\1)#g" \
            "$notes" > /tmp/release-notes.md
          gh release create "$TAG" "$asset" \
            --verify-tag \
            --title "v$VERSION" \
            --notes-file /tmp/release-notes.md
