[versions]
# 版本天花板：本机 SDK 只有 platform android-36，且 AGP 8.13.2 最高支持 compileSdk 36。
# 因此每个 AndroidX 依赖都必须满足 aar-metadata 的 minCompileSdk<=36 且
# minAndroidGradlePluginVersion<=8.13.2，否则 checkDebugAarMetadata 直接失败。
# 已撞过这堵墙的：compose-bom 2026.09、core-ktx 1.19、okhttp 5.x、navigation 2.10、lifecycle 2.11。
# 工具链升到 AGP 9.1+ 且装上 android-37 后，可以整批抬回最新版。
agp = "8.13.2"
kotlin = "2.4.20"
composeBom = "2026.06.01"
coreKtx = "1.18.0"
activityCompose = "1.13.0"
navigationCompose = "2.9.6"
lifecycle = "2.10.0"
coroutines = "1.11.0"
quickjs = "3.2.3"
# OkHttp 5.x 要求 compileSdk 37，锁 4.x
okhttp = "4.12.0"
# media3 1.11.1 要求 minCompileSdk=36，正好在天花板内
media3 = "1.11.1"
junit = "4.13.2"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
# ui-test 1.11.4 自己带的是 espresso-core 3.5.0，它构造 UiController 时走
# `InputManager.getInstance()`（隐藏 API）。Android 17 / API 37 上这个方法已经没了，
# 于是任何一个 Compose UI 测试都会在 `Espresso.onIdle()` 里抛 NoSuchMethodException——
# 还没跑到断言就死。3.7.0 换掉了这条取用路径，与 runner 1.7.0 同批发布
espressoCore = "3.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# 共享元素/M10 的 AnimatedContent 一族直接在这里显式声明：以前只是 material3 带进来的
# 传递依赖（版本由 BOM 统一为 1.11.4），哪天 material3 不再依赖它，编译会立刻断
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
quickjs-wrapper-android = { group = "wang.harlon.quickjs", name = "wrapper-android", version.ref = "quickjs" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
androidx-media3-datasource = { group = "androidx.media3", name = "media3-datasource", version.ref = "media3" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
